name: .NET Regression Tests

on:
  push:
    branches: ["master"]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/**'
  pull_request:
    branches: ["master"]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LabWork10.sln

      - name: Build solution
        run: dotnet build LabWork10.sln --no-restore --configuration Release

      - name: Run tests with coverage and generate TRX log
        run: dotnet test LabWork10.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Test results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx

      - name: Generate coverage report
        uses: danielpalme/reportgenerator-action@5.4.1
        if: success() || failure()
        with:
          reports: 'TestResults/**/coverage.cobertura.xml'
          targetdir: 'CoverageReport'
          reporttypes: 'HtmlInline_AzurePipelines;Html_Dark;MarkdownSummaryGithub'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-report
          path: CoverageReport
